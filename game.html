<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Finding Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game">
    <h1>Word Finding Game</h1>
    <p>Click the first letter, then the last letter of a word.</p>
    <div id="board"></div>
    <ul id="word-list"></ul>
    <p id="message"></p>
    <button id="new-game">New Game</button>
    <button id="next-level" class="hidden">Next Level ➡</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
